# ─────────────────────────────────────────────────────────────
#  imranalasr.sa — Nginx reverse proxy in front of the Next.js
#  server (which listens on 127.0.0.1:3000).
#
#  Install:  /etc/nginx/sites-available/imranalasr.sa
#            ln -s ../sites-available/imranalasr.sa /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#
#  TLS:      certbot --nginx -d imranalasr.sa -d www.imranalasr.sa
#            (run it AFTER the A records point here, or it cannot validate)
# ─────────────────────────────────────────────────────────────

# www → apex, and http → https. Certbot rewrites this block when it runs.
server {
    listen 80;
    listen [::]:80;
    server_name imranalasr.sa www.imranalasr.sa;

    # Let certbot answer its challenge before anything else redirects.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://imranalasr.sa$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.imranalasr.sa;

    ssl_certificate     /etc/letsencrypt/live/imranalasr.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imranalasr.sa/privkey.pem;

    return 301 https://imranalasr.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name imranalasr.sa;

    ssl_certificate     /etc/letsencrypt/live/imranalasr.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imranalasr.sa/privkey.pem;

    # Arabic pages compress very well; images are already WebP/AVIF.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json;
    gzip_min_length 512;

    client_max_body_size 12m;

    # Next.js fingerprints these — cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
